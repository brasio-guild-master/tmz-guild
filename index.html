    function getMonthDatesList(baseDateStr) {
      const list = [];
      let y, m;
      if (baseDateStr && /^\d{4}-\d{2}-\d{2}$/.test(baseDateStr)) {
        const parts = baseDateStr.split('-').map(Number);
        y = parts[0];
        m = parts[1] - 1;
      } else {
        const now = new Date();
        y = now.getFullYear();
        m = now.getMonth();
      }
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัส', 'ศุกร์', 'เสาร์'];
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(y, m, day);
        const mm = String(m + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        list.push({ dateStr: `${y}-${mm}-${dd}`, dayName: days[d.getDay()], dayNum: String(day), monthShort: months[m] });
      }
      return list;
    }

    function getTodayDateStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatThaiDateInfo(dateStr, dynamicList) {
      const found = (dynamicList || []).find((d) => d.dateStr === dateStr);
      if (found) return found;
      try {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัส', 'ศุกร์', 'เสาร์'];
        const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        return { dateStr, dayName: days[dt.getDay()] || '', dayNum: String(d || ''), monthShort: months[(m || 1) - 1] || '' };
      } catch (e) {
        return { dateStr, dayName: '', dayNum: dateStr, monthShort: '' };
      }
    }

                <span className="text-[11px] font-black text-indigo-700 dark:text-indigo-300 leading-none inline-flex items-center">({dynamicOriginLabel})</span>
              )}
            </div>
            {!isGuildView ? (
              <div className="flex items-center gap-1 shrink-0" data-html2canvas-ignore="true">
                {onToggleLeave && (
                  <button type="button" onClick={(e) => { e.stopPropagation(); onToggleLeave(member); }} className={`px-2 py-0.5 rounded-md text-[10px] font-extrabold border inline-flex items-center justify-center leading-none ${isOnLeave ? 'bg-red-600 text-white border-red-700' : 'bg-white/80 dark:bg-slate-800/80 text-red-600 border-red-300'}`}>
                    ลา
                  </button>
                )}
                {onOpenTempSubModal && (
                  <button type="button" onClick={(e) => { e.stopPropagation(); onOpenTempSubModal(member); }} className={`p-1 rounded-md text-[10px] font-bold inline-flex items-center justify-center ${isSwapped ? 'bg-indigo-600 text-white' : 'hover:bg-black/10 text-slate-600 dark:text-slate-300'}`} title="สลับคนระหว่างตี้">
                    <ArrowRightLeft className="w-3 h-3" />
                  </button>
                )}
                {onRemoveFromParty && (
                  <button type="button" onClick={(e) => { e.stopPropagation(); onRemoveFromParty(member.id); }} className="p-1 rounded-md hover:bg-rose-600 hover:text-white text-slate-500 inline-flex items-center justify-center" title="นำออกจากตี้">
                    <X className="w-3 h-3" />
                  </button>
                )}
              </div>
            ) : (
              isOnLeave && (
                <span className="px-2 py-0.5 rounded-md bg-red-600 text-white text-[10px] font-extrabold shrink-0 inline-flex items-center justify-center leading-none">
                  ลา
                </span>
              )
            )}
          </div>

          <div className={`text-[12px] font-bold leading-none mt-1.5 flex items-center justify-between gap-2 min-h-[20px] ${isOnLeave ? 'text-red-800 dark:text-red-200 font-bold' : isLight ? 'text-slate-600' : 'text-slate-300'}`}>
            <div className="inline-flex items-center gap-1.5 flex-wrap leading-none">
              <JobClassEmblem jobName={jobInfo.id} accentColor={jobInfo.leftAccent} customIcon={jobInfo.customIcon} className="w-4 h-4" />
              <span className="inline-flex items-center leading-none">{jobInfo.name}</span>
              {isSwapped && partnerName && (
                <span className="inline-flex items-center justify-center gap-0.5 text-[10px] font-extrabold text-indigo-700 dark:text-indigo-200 bg-indigo-500/15 border border-indigo-500/30 px-1.5 py-0.5 rounded leading-none">
                  แทน {partnerName}
                </span>
              )}
            </div>
            <span className="font-extrabold tabular-nums text-right shrink-0 inline-flex items-center leading-none">
              {(member.cp || 0).toLocaleString()}
            </span>
          </div>
        </div>
      );
    }

    function JobBadge({ jobName, jobMap }) {
      const jobInfo = jobMap[jobName] || DEFAULT_JOB_CLASSES[0];
      return (
        <div className="inline-flex items-center gap-2 text-xs font-bold text-slate-700 dark:text-slate-200 select-none w-[135px] text-left">
          <JobClassEmblem jobName={jobInfo.id} accentColor={jobInfo.leftAccent} customIcon={jobInfo.customIcon} className="w-5 h-5" />
          <span className="truncate leading-none">{jobInfo.name}</span>
        </div>
      );
    }

    function App() {
      const todayDefaultStr = useMemo(() => getTodayDateStr(), []);

      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.members) && Array.isArray(parsed.parties)) {
              return {
                ...generateInitialCleanData(),
                ...parsed,
                members: ensureDualModeMembers(parsed.members),
                parties: normalizePartiesBadge(parsed.parties),
                gvgGroups: upgradeDistinctGroupColors(parsed.gvgGroups, DEFAULT_GVG_GROUPS),
                woeGroups: upgradeDistinctGroupColors(parsed.woeGroups, DEFAULT_WOE_GROUPS),
                polarityUi: { ...DEFAULT_POLARITY_UI, ...(parsed.polarityUi || {}) },
                rosterUi: { ...DEFAULT_ROSTER_UI, ...(parsed.rosterUi || {}) },
                lineupsByDate: parsed.lineupsByDate || {},
                activeWarDate: parsed.activeWarDate || todayDefaultStr
              };
            }
          }
        } catch (e) {}
        return generateInitialCleanData();
      });

      const [isGuildView, setIsGuildView] = useState(false);

      const [cloudCfg, setCloudCfg] = useState(() => {
        try {
          const c = localStorage.getItem(CLOUD_CFG_KEY);
          if (c) return { ...DEFAULT_CLOUD_CONFIG, ...JSON.parse(c) };
        } catch (e) {}
        return DEFAULT_CLOUD_CONFIG;
      });
      const [cloudQuota, setCloudQuota] = useState(null);
      const [isCloudModalOpen, setIsCloudModalOpen] = useState(false);
      const [cloudStatus, setCloudStatus] = useState('กำลังเชื่อมต่อ Cloud...');
      const isFetchingCloudRef = useRef(false);

      const [theme, setTheme] = useState(() => { try { return localStorage.getItem('tmzclub_theme') || 'light'; } catch (e) { return 'light'; } });
      const [jobClasses, setJobClasses] = useState(() => {
        try {
          const s = localStorage.getItem('tmzclub_job_colors_v20');
          if (s) return upgradeJobClassColors(JSON.parse(s));
        } catch (e) {}
        return DEFAULT_JOB_CLASSES;
      });
      const [newJobNameInput, setNewJobNameInput] = useState('');
      const [confirmDeleteJob, setConfirmDeleteJob] = useState(null);

      const [isMasterSettingsOpen, setIsMasterSettingsOpen] = useState(false);
      const [masterSettingsCategory, setMasterSettingsCategory] = useState('guild');
      const [selectedGroupForSettings, setSelectedGroupForSettings] = useState('A');
      const [lanePopupInfo, setLanePopupInfo] = useState(null);

      const isLight = theme === 'light';
      const fileInputRef = useRef(null);
      const logoUploadRef = useRef(null);

      useEffect(() => {
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        try { localStorage.setItem('tmzclub_theme', theme); } catch (e) {}
      }, [theme]);

      useEffect(() => {
        try { localStorage.setItem('tmzclub_job_colors_v20', JSON.stringify(jobClasses)); } catch (e) {}
      }, [jobClasses]);

      useEffect(() => {
        try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudCfg)); } catch (e) {}
      }, [cloudCfg]);

      const jobMap = useMemo(() => jobClasses.reduce((acc, j) => { acc[j.id] = j; return acc; }, {}), [jobClasses]);
      const [lastSavedTime, setLastSavedTime] = useState('พร้อมใช้งาน');

      const extractQuotaFromHeaders = (headers) => {
        const rem = headers.get('X-RateLimit-Remaining') || headers.get('x-ratelimit-remaining') || headers.get('X-Ratelimit-Remaining');
        if (rem !== null && !isNaN(Number(rem))) {
          setCloudQuota(Number(rem));
        }
      };

      useEffect(() => {
        if (!cloudCfg.autoSync || !cloudCfg.apiKey || !cloudCfg.binId) {
          setCloudStatus('โหมดบันทึกในเครื่อง');
          return;
        }
        const initLoad = async () => {
          try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${cloudCfg.binId}/latest`, {
              headers: { 'X-Master-Key': cloudCfg.apiKey }
            });
            extractQuotaFromHeaders(res.headers);
            if (res.ok) {
              const json = await res.json();
              if (json.record && json.record.guildData && Array.isArray(json.record.guildData.parties)) {
                isFetchingCloudRef.current = true;
                setData((prev) => ({
                  ...prev,
                  ...json.record.guildData,
                  members: ensureDualModeMembers(json.record.guildData.members),
                  parties: normalizePartiesBadge(json.record.guildData.parties),
                  gvgGroups: upgradeDistinctGroupColors(json.record.guildData.gvgGroups, DEFAULT_GVG_GROUPS),
                  woeGroups: upgradeDistinctGroupColors(json.record.guildData.woeGroups, DEFAULT_WOE_GROUPS),
                  polarityUi: { ...DEFAULT_POLARITY_UI, ...(json.record.guildData.polarityUi || {}) },
                  rosterUi: { ...DEFAULT_ROSTER_UI, ...(json.record.guildData.rosterUi || {}) },
                  lineupsByDate: json.record.guildData.lineupsByDate || {},
                  activeWarDate: json.record.guildData.activeWarDate || todayDefaultStr
                }));
                if (json.record.jobClasses) setJobClasses(upgradeJobClassColors(json.record.jobClasses));
                setCloudStatus('ซิงค์ Cloud ออนไลน์');
              } else {
                setCloudStatus('ซิงค์ Cloud ออนไลน์ (ฐานข้อมูลว่าง)');
              }
            } else if (res.status === 429) {
              setCloudQuota(0);
              setCloudStatus('โควตา Cloud เต็ม (เซฟในเครื่องแทน)');
            } else {
              setCloudStatus('พร้อมซิงค์ Cloud');
            }
          } catch (e) {
            setCloudStatus('โหมดบันทึกในเครื่อง');
          }
        };
        initLoad();
      }, []);

      useEffect(() => {
        try {
          const payloadStr = JSON.stringify(data);
          localStorage.setItem(STORAGE_KEY, payloadStr);
          const timeStr = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          setLastSavedTime(timeStr);

          if (isFetchingCloudRef.current) {
            isFetchingCloudRef.current = false;
            return;
          }

          if (cloudCfg.autoSync && cloudCfg.apiKey && cloudCfg.binId) {
            fetch(`https://api.jsonbin.io/v3/b/${cloudCfg.binId}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', 'X-Master-Key': cloudCfg.apiKey },
              body: JSON.stringify({ guildData: data, jobClasses, updatedAt: Date.now() })
            })
              .then((r) => {
                extractQuotaFromHeaders(r.headers);
                if (r.ok) {
                  setCloudStatus(`ซิงค์ Cloud ออนไลน์`);
                } else if (r.status === 429) {
                  setCloudQuota(0);
                  setCloudStatus('โควตา Cloud เต็ม! (เซฟลงเครื่องแทน)');
                }
              })
              .catch(() => setCloudStatus('ซิงค์ Cloud ขัดข้อง (เซฟในเครื่อง)'));
          }
        } catch (e) {}
      }, [data, jobClasses]);

      useEffect(() => {
        if (!cloudCfg.autoSync || !cloudCfg.apiKey || !cloudCfg.binId) return;
        const timer = setInterval(async () => {
          try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${cloudCfg.binId}/latest`, {
              headers: { 'X-Master-Key': cloudCfg.apiKey }
            });
            extractQuotaFromHeaders(res.headers);
            if (res.ok) {
              const json = await res.json();
              const record = json.record;
              if (record && record.guildData && Array.isArray(record.guildData.parties)) {
                const currentStr = JSON.stringify({ ...data, activeWarDate: '' });
                const incomingStr = JSON.stringify({ ...record.guildData, activeWarDate: '' });
                if (currentStr !== incomingStr) {
                  isFetchingCloudRef.current = true;
                  setData((prev) => ({
                    ...record.guildData,
                    members: ensureDualModeMembers(record.guildData.members),
                    parties: normalizePartiesBadge(record.guildData.parties),
                    gvgGroups: upgradeDistinctGroupColors(record.guildData.gvgGroups, DEFAULT_GVG_GROUPS),
                    woeGroups: upgradeDistinctGroupColors(record.guildData.woeGroups, DEFAULT_WOE_GROUPS),
                    polarityUi: { ...DEFAULT_POLARITY_UI, ...(record.guildData.polarityUi || {}) },
                    rosterUi: { ...DEFAULT_ROSTER_UI, ...(record.guildData.rosterUi || {}) },
                    lineupsByDate: record.guildData.lineupsByDate || {},
                    activeWarDate: prev.activeWarDate
                  }));
                  if (record.jobClasses) setJobClasses(upgradeJobClassColors(record.jobClasses));
                }
              }
            }
          } catch (e) {}
        }, 8000);
        return () => clearInterval(timer);
      }, [cloudCfg, data]);

      const handleCreateOrConnectCloudBin = async (e) => {
        e.preventDefault();
        if (!cloudCfg.apiKey.trim()) { showToast('กรุณาใส่ X-Master-Key จาก JSONBin.io'); return; }
        try {
          if (!cloudCfg.binId.trim()) {
            setCloudStatus('กำลังสร้างฐานข้อมูล Cloud...');
            const res = await fetch('https://api.jsonbin.io/v3/b', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-Master-Key': cloudCfg.apiKey.trim(), 'X-Bin-Name': 'TMZClub_Guild_DB' },
              body: JSON.stringify({ guildData: data, jobClasses, updatedAt: Date.now() })
            });
            extractQuotaFromHeaders(res.headers);
            if (res.ok) {
              const json = await res.json();
              const newBinId = json.metadata?.id;
              if (newBinId) {
                setCloudCfg((p) => ({ ...p, binId: newBinId, autoSync: true }));
                setCloudStatus('ซิงค์ Cloud ออนไลน์');
                showToast(`สร้างฐานข้อมูลสำเร็จ! Bin ID: ${newBinId}`);
                setIsCloudModalOpen(false);
              }
            } else {
              showToast('API Key ไม่ถูกต้อง');
            }
          } else {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${cloudCfg.binId.trim()}/latest`, {
              headers: { 'X-Master-Key': cloudCfg.apiKey.trim() }
            });
            extractQuotaFromHeaders(res.headers);
            if (res.ok) {
              const json = await res.json();
              if (json.record?.guildData) {
                isFetchingCloudRef.current = true;
                setData({
                  ...json.record.guildData,
                  members: ensureDualModeMembers(json.record.guildData.members),
                  parties: normalizePartiesBadge(json.record.guildData.parties)
                });
                if (json.record.jobClasses) setJobClasses(upgradeJobClassColors(json.record.jobClasses));
              }
              setCloudCfg((p) => ({ ...p, autoSync: true }));
              setCloudStatus('ซิงค์ Cloud ออนไลน์');
              showToast('เชื่อมต่อฐานข้อมูล Cloud เรียบร้อย!');
              setIsCloudModalOpen(false);
            } else {
              showToast('ไม่พบ Bin ID หรือ API Key ไม่ถูกต้อง');
            }
          }
        } catch (err) {
          showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ Cloud');
        }
      };

      const {
        members, parties, gvgGroups = DEFAULT_GVG_GROUPS, woeGroups = DEFAULT_WOE_GROUPS,
        headerConfig = DEFAULT_HEADER_CONFIG, modeConfig = DEFAULT_MODE_CONFIG, polarityUi = DEFAULT_POLARITY_UI, rosterUi = DEFAULT_ROSTER_UI,
        leaveByDate = {}, lineupsByDate = {}, activeWarDate = todayDefaultStr
      } = data;

      const dynamicLeaveDates = useMemo(() => getMonthDatesList(activeWarDate), [activeWarDate]);

      // ข้อ 1: Serialize ข้อมูลผังปาร์ตี้แยกกันชัดเจนทั้ง GVG และ WOE
      const serializeMemberLineup = (memberList) => {
        const snap = {};
        (memberList || []).forEach((m) => {
          snap[m.id] = {
            partyId: m.partyId ?? null,
            slotIndex: m.slotIndex ?? 0,
            isLeader: !!m.isLeader,
            tempSub: m.tempSub ? { ...m.tempSub } : { active: false },
            woePartyId: m.woePartyId !== undefined ? m.woePartyId : (m.partyId ?? null),
            woeSlotIndex: m.woeSlotIndex !== undefined ? m.woeSlotIndex : (m.slotIndex ?? 0),
            woeIsLeader: m.woeIsLeader !== undefined ? !!m.woeIsLeader : !!m.isLeader,
            woeTempSub: m.woeTempSub ? { ...m.woeTempSub } : (m.tempSub ? { ...m.tempSub } : { active: false })
          };
        });
        return snap;
      };

      const setSharedWarAndLeaveDate = (newDateStr) => {
        if (!newDateStr || newDateStr === activeWarDate) return;
        setData((prev) => {
          const curDate = prev.activeWarDate || todayDefaultStr;
          const currentSnap = serializeMemberLineup(prev.members);
          const nextLineups = { ...(prev.lineupsByDate || {}), [curDate]: currentSnap };
          const targetSnap = nextLineups[newDateStr];

          let nextMembers = prev.members;
          if (targetSnap) {
            nextMembers = prev.members.map((m) => {
              const st = targetSnap[m.id];
              if (st) {
                return {
                  ...m,
                  partyId: st.partyId ?? null,
                  slotIndex: st.slotIndex ?? 0,
                  isLeader: !!st.isLeader,
                  tempSub: st.tempSub ? { ...st.tempSub } : { active: false },
                  woePartyId: st.woePartyId !== undefined ? st.woePartyId : (st.partyId ?? null),
                  woeSlotIndex: st.woeSlotIndex !== undefined ? st.woeSlotIndex : (st.slotIndex ?? 0),
                  woeIsLeader: st.woeIsLeader !== undefined ? !!st.woeIsLeader : !!st.isLeader,
                  woeTempSub: st.woeTempSub ? { ...st.woeTempSub } : (st.tempSub ? { ...st.tempSub } : { active: false })
                };
              }
              return m;
            });
          } else {
            nextLineups[newDateStr] = serializeMemberLineup(prev.members);
          }

          return {
            ...prev,
            activeWarDate: newDateStr,
            members: nextMembers,
            lineupsByDate: nextLineups
          };
        });
      };

      const updateMembersForActiveDate = (updaterFn) => {
        setData((prev) => {
          const updatedMembers = updaterFn(prev.members, prev);
          const curDate = prev.activeWarDate || todayDefaultStr;
          return {
            ...prev,
            members: updatedMembers,
            lineupsByDate: {
              ...(prev.lineupsByDate || {}),
              [curDate]: serializeMemberLineup(updatedMembers)
            }
          };
        });
      };

      const [activeTab, setActiveTab] = useState('gvg');
      const [selectedTeamFilter, setSelectedTeamFilter] = useState('ALL');

      // ข้อ 1: ตัวช่วยดึงและบันทึกค่าตามโหมดที่กำลังเปิดอยู่ (GVG หรือ WOE แยกจากกัน 100%)
      const isWoeMode = activeTab === 'woe';
      const getModePartyId = (m, woe = isWoeMode) => (woe ? (m.woePartyId !== undefined ? m.woePartyId : m.partyId) : m.partyId);
      const getModeSlotIndex = (m, woe = isWoeMode) => (woe ? (m.woeSlotIndex !== undefined ? m.woeSlotIndex : m.slotIndex) : m.slotIndex);
      const getModeTempSub = (m, woe = isWoeMode) => (woe ? (m.woeTempSub !== undefined ? m.woeTempSub : m.tempSub) : m.tempSub);

      const assignModePlacement = (m, { partyId, slotIndex, isLeader, tempSub }, woe = isWoeMode) => {
        if (woe) {
          if (partyId !== undefined) m.woePartyId = partyId;
          if (slotIndex !== undefined) m.woeSlotIndex = slotIndex;
          if (isLeader !== undefined) m.woeIsLeader = isLeader;
          if (tempSub !== undefined) m.woeTempSub = tempSub;
        } else {
          if (partyId !== undefined) m.partyId = partyId;
          if (slotIndex !== undefined) m.slotIndex = slotIndex;
          if (isLeader !== undefined) m.isLeader = isLeader;
          if (tempSub !== undefined) m.tempSub = tempSub;
        }
      };

      const [tabFilters, setTabFilters] = useState({
        party: { search: '', job: 'ALL', role: 'ALL', group: 'ALL', dot: 'ALL', tempSub: false },
        polarity: { search: '', job: 'ALL', role: 'ALL', group: 'ALL', dot: 'ALL', tempSub: false },
        roster: { search: '', job: 'ALL', role: 'ALL', group: 'ALL', dot: 'ALL', tempSub: false }
      });

      const getFilterKey = (tab) => (tab === 'gvg' || tab === 'woe' ? 'party' : tab);
      const currentTabKey = getFilterKey(activeTab);
      const updateCurrentTabFilter = (field, val) => {
        setTabFilters((prev) => ({ ...prev, [currentTabKey]: { ...prev[currentTabKey], [field]: val } }));
      };

      const [polarityFilter, setPolarityFilter] = useState('ALL');
      const [polaritySortBy, setPolaritySortBy] = useState('ID_ASC');
      const [polaritySummarySort, setPolaritySummarySort] = useState('DEFAULT');
      const [selectedSlot, setSelectedSlot] = useState(null);
      const [draggedItem, setDraggedItem] = useState(null);

      const [rosterSortBy, setRosterSortBy] = useState('ID_ASC');
      const [selectedRosterIds, setSelectedRosterIds] = useState([]);
      const [bulkGroupTarget, setBulkGroupTarget] = useState('A');

      const [inlineEdits, setInlineEdits] = useState({});

      const startInlineEdit = (memberId, field, value) => {
        setInlineEdits((prev) => ({
          ...prev,
          [memberId]: { ...(prev[memberId] || {}), [field]: value }
        }));
      };

      const saveInlineEdit = (member) => {
        const changes = inlineEdits[member.id];
        if (!changes) return;
        setData((prev) => ({
          ...prev,
          members: prev.members.map((m) =>
            m.id === member.id
              ? {
                  ...m,
                  ...changes,
                  sheetId: changes.sheetId !== undefined ? Number(changes.sheetId) || m.sheetId : m.sheetId,
                  name: changes.name !== undefined ? String(changes.name).trim() || m.name : m.name,
                  lv: changes.lv !== undefined ? Number(changes.lv) || m.lv : m.lv,
                  cp: changes.cp !== undefined ? Number(String(changes.cp).replace(/,/g, '')) || 0 : m.cp
                }
              : m
          )
        }));
        setInlineEdits((prev) => {
          const next = { ...prev };
          delete next[member.id];
          return next;
        });
        showToast(`บันทึกการแก้ไขของ "${changes.name || member.name}" เรียบร้อย!`);
      };

      const cancelInlineEdit = (memberId) => {
        setInlineEdits((prev) => {
          const next = { ...prev };
          delete next[memberId];
          return next;
        });
      };

      const setMemberDotColor = (memberId, colorVal) => {
        setData((prev) => ({
          ...prev,
          members: prev.members.map((m) => (m.id === memberId ? { ...m, dotColor: colorVal } : m))
        }));
      };

      const handleClearSelectedGroups = () => {
        if (selectedRosterIds.length === 0) return;
        const idSet = new Set(selectedRosterIds);
        setData((prev) => ({
          ...prev,
          members: prev.members.map((m) => (idSet.has(m.id) ? { ...m, group: '' } : m))
        }));
        showToast(`ยกเลิกกลุ่มของสมาชิกที่เลือก ${selectedRosterIds.length} คนเรียบร้อย!`);
      };

      const handleClearSelectedDots = () => {
        if (selectedRosterIds.length === 0) return;
        const idSet = new Set(selectedRosterIds);
        setData((prev) => ({
          ...prev,
          members: prev.members.map((m) => (idSet.has(m.id) ? { ...m, dotColor: '' } : m))
        }));
        showToast(`ยกเลิกจุดสีของสมาชิกที่เลือก ${selectedRosterIds.length} คนเรียบร้อย!`);
      };

      const [isSheetSyncOpen, setIsSheetSyncOpen] = useState(false);
      const [sheetRawText, setSheetRawText] = useState('');
      const [sheetDiffResult, setSheetDiffResult] = useState(null);
      const [renameSourceOldId, setRenameSourceOldId] = useState('');
      const [renameTargetNewName, setRenameTargetNewName] = useState('');

      const [isHeaderConfigOpen, setIsHeaderConfigOpen] = useState(false);
      const [editHeaderConfig, setEditHeaderConfig] = useState(headerConfig);

      const [isModeConfigModalOpen, setIsModeConfigModalOpen] = useState(false);
      const [editModeConfig, setEditModeConfig] = useState(modeConfig);

      const [isPolarityUiModalOpen, setIsPolarityUiModalOpen] = useState(false);

      const handleReorderPartyInTeam = (groupId, fromIdxInTeam, toIdxInTeam) => {
        const isWoe = activeTab === 'woe';
        setData((prev) => {
          const teamParties = prev.parties.filter((p) => (isWoe ? p.woeGroup === groupId : p.gvgGroup === groupId));
          if (fromIdxInTeam < 0 || toIdxInTeam < 0 || fromIdxInTeam >= teamParties.length || toIdxInTeam >= teamParties.length || fromIdxInTeam === toIdxInTeam) {
            return prev;
          }
          const reordered = [...teamParties];

      const captureElementAsPng = async (elementId, filename) => {

        try {

            await document.fonts.ready;

            scale: 2,
            useCORS: true,
            backgroundColor: isLight ? '#f8fafc' : '#090d16',
            windowWidth: 1600,
            logging: false,
            onclone: (clonedDoc) => {
              const target = clonedDoc.getElementById(elementId);
              if (target) {
                const wrapper = clonedDoc.createElement('div');
                wrapper.style.width = '1480px';
                wrapper.style.padding = '28px';
                wrapper.style.margin = '0 auto';
                wrapper.style.boxSizing = 'border-box';
                wrapper.style.backgroundColor = isLight ? '#f8fafc' : '#090d16';
                wrapper.style.display = 'flex';
                wrapper.style.justifyContent = 'center';
                wrapper.style.alignItems = 'center';

                target.style.width = '1424px';
                target.style.maxWidth = '1424px';
                target.style.margin = '0 auto';
                target.style.boxSizing = 'border-box';

                if (target.parentNode) {
                  target.parentNode.insertBefore(wrapper, target);
                  wrapper.appendChild(target);
                }

                target.querySelectorAll('.party-grid-4cols').forEach((grid) => {
                  grid.style.display = 'grid';
                  grid.style.gridTemplateColumns = 'repeat(4, minmax(0, 1fr))';
                  grid.style.gap = '14px';
                });

                target.querySelectorAll('[data-html2canvas-ignore="true"]').forEach((node) => {
                  node.style.display = 'none';
                });

                target.querySelectorAll('input[type="text"], select').forEach((inp) => {
                  const box = clonedDoc.createElement('div');
                  const textVal = inp.tagName === 'SELECT' ? (inp.options[inp.selectedIndex]?.text || inp.value) : inp.value;
                  box.textContent = textVal;
                  box.className = inp.className;
                  box.style.backgroundColor = inp.style.backgroundColor || '';
                  box.style.color = inp.style.color || '';
                  box.style.borderColor = inp.style.borderColor || '';
                  box.style.display = 'inline-flex';
                  box.style.alignItems = 'center';
                  box.style.justifyContent = (inp.tagName === 'SELECT' || inp.classList.contains('text-center')) ? 'center' : 'flex-start';
                  box.style.lineHeight = '1';
                  box.style.paddingTop = '4px';
                  box.style.paddingBottom = '4px';
                  box.style.verticalAlign = 'middle';
                  box.style.overflow = 'visible';
                  if (inp.parentNode) inp.parentNode.replaceChild(box, inp);
                });

                target.querySelectorAll('svg, img').forEach((media) => {
                  media.style.display = 'inline-block';
                  media.style.verticalAlign = 'middle';
                  media.style.flexShrink = '0';
                });
              }
            }
          });
          const link = clonedDocLink(canvas, filename);
          showToast(`บันทึกรูปภาพ ${filename}.png เรียบร้อยแล้ว!`);
        } catch (err) {
          showToast('เกิดข้อผิดพลาดในการบันทึกรูปภาพ');

      const clonedDocLink = (canvas, filename) => {

      const currentModeGroups = useMemo(() => activeTab === 'woe' ? woeGroups : gvgGroups, [activeTab, gvgGroups, woeGroups]);

      const getDynamicPartyCode = (partyId, originGroupId, originSubIdx) => {
        const pObj = parties.find((p) => p.id === partyId);
        const gId = pObj ? (activeTab === 'woe' ? pObj.woeGroup : pObj.gvgGroup) : originGroupId;
        if (!gId) return 'สำรอง';
        const grp = currentModeGroups.find((g) => g.id === gId) || gvgGroups.find((g) => g.id === gId);
        const groupLabel = grp ? (grp.tag || grp.name || grp.id) : gId;

        if (pObj) {
          const teamParties = parties.filter((x) => (activeTab === 'woe' ? x.woeGroup === gId : x.gvgGroup === gId));

        return `${groupLabel}-${pIdx}`;

      // ข้อ 1: คำนวณสมาชิกในแต่ละปาร์ตี้แยกตามโหมด GVG และโหมดศึกชิงปราสาท (WOE)
      const partyMembersMap = useMemo(() => {
        const isWoe = activeTab === 'woe';
        const validGroupIds = new Set((isWoe ? woeGroups : gvgGroups).map((g) => g.id));
        const map = {};
        parties.forEach((p) => { map[p.id] = [null, null, null, null, null]; });

        members.forEach((m) => {
          const pid = isWoe ? (m.woePartyId !== undefined ? m.woePartyId : m.partyId) : m.partyId;

          const pObj = pid ? parties.find((p) => p.id === pid) : null;
          const pGroup = pObj ? (isWoe ? pObj.woeGroup : pObj.gvgGroup) : null;

          if (pid && map[pid] && pGroup && validGroupIds.has(pGroup)) {
            const sIdx = typeof sIdxRaw === 'number' && sIdxRaw >= 0 && sIdxRaw < 5 ? sIdxRaw : 0;
            if (!map[pid][sIdx]) map[pid][sIdx] = m;
            else {
              const emptyIdx = map[pid].findIndex((x) => x === null);
              if (emptyIdx !== -1) map[pid][emptyIdx] = m;
              else unassigned.push(m);

        return { map, unassigned };

          stats[gId].partyCount += 1;

        e.preventDefault();
        if (!leaveMemberIdInput) return;
        const targetMember = members.find((m) => m.id === leaveMemberIdInput);

        const startStr = leaveStartDateInput || activeWarDate;
        const endStr = leaveEndDateInput || startStr;
        const sDate = new Date(startStr);
        const eDate = new Date(endStr);

        const dateKeys = [];
        if (!isNaN(sDate) && !isNaN(eDate) && eDate >= sDate) {
          const cur = new Date(sDate);
          let guard = 0;
          while (cur <= eDate && guard < 62) {
            const yy = cur.getFullYear();
            const mm = String(cur.getMonth() + 1).padStart(2, '0');
            const dd = String(cur.getDate()).padStart(2, '0');
            dateKeys.push(`${yy}-${mm}-${dd}`);
            cur.setDate(cur.getDate() + 1);
            guard++;
          }
        } else {
          dateKeys.push(activeWarDate);
        }

        const isRange = dateKeys.length > 1;
        const baseReason = leaveReasonInput.trim() || (isRange ? `แจ้งลายาว (${startStr} ถึง ${endStr})` : 'แจ้งลาล่วงหน้า');

        setData((prev) => {
          const nextLeaveByDate = { ...(prev.leaveByDate || {}) };
          dateKeys.forEach((dKey, idx) => {
            const list = nextLeaveByDate[dKey] || [];
            if (!list.some((item) => item.memberId === targetMember.id)) {
              nextLeaveByDate[dKey] = [
                ...list,
                {
                  id: `lv-${Date.now()}-${idx}`,
                  memberId: targetMember.id,
                  memberName: targetMember.name,
                  reason: baseReason
                }

            }
          });
          return { ...prev, leaveByDate: nextLeaveByDate };

        setLeaveMemberIdInput('');

            : `เพิ่มการลาวันที่ ${startStr} ของ "${targetMember.name}" เรียบร้อย`

        }));
