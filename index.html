      // ข้อ 1: สลับคนระหว่างตี้ แยกตามโหมด GVG และ WOE
      const handleExecuteMemberSwap = (targetPartner) => {
        if (!tempSubModalMember || !targetPartner) return;
        const woe = activeTab === 'woe';
        const pidA = getModePartyId(tempSubModalMember, woe);
        const pidB = getModePartyId(targetPartner, woe);
        const pObjA = parties.find((p) => p.id === pidA);
        const pObjB = parties.find((p) => p.id === pidB);

        updateMembersForActiveDate((prevMembers) => {
          const nextMembers = prevMembers.map((m) => ({ ...m }));
          const memA = nextMembers.find((m) => m.id === tempSubModalMember.id);
          const memB = nextMembers.find((m) => m.id === targetPartner.id);
          if (memA && memB) {
            const pA = getModePartyId(memA, woe);
            const sA = getModeSlotIndex(memA, woe);
            const subA = getModeTempSub(memA, woe);

            const pB = getModePartyId(memB, woe);
            const sB = getModeSlotIndex(memB, woe);
            const subB = getModeTempSub(memB, woe);

            assignModePlacement(memA, {
              partyId: pB,
              slotIndex: sB,
              isLeader: pB ? sB === 0 : false,
              tempSub: {
                active: true,
                originPartyId: subA?.originPartyId ?? pA,
                originGroupId: subA?.originGroupId || (pObjA ? (woe ? pObjA.woeGroup : pObjA.gvgGroup) : ''),
                originSubIdx: subA?.originSubIdx || (pObjA ? pObjA.subIdx : 0),
                partnerId: memB.id,
                partnerName: memB.name
              }
            }, woe);

            assignModePlacement(memB, {
              partyId: pA,
              slotIndex: sA,
              isLeader: pA ? sA === 0 : false,
              tempSub: {
                active: true,
                originPartyId: subB?.originPartyId ?? pB,
                originGroupId: subB?.originGroupId || (pObjB ? (woe ? pObjB.woeGroup : pObjB.gvgGroup) : ''),
                originSubIdx: subB?.originSubIdx || (pObjB ? pObjB.subIdx : 0),
                partnerId: memA.id,
                partnerName: memA.name
              }
            }, woe);
          }
          return nextMembers;
        });

        setTempSubModalMember(null);
        showToast(`สลับตำแหน่งโหมด${woe ? 'ศึกชิงปราสาท' : ' Guild League'} สำหรับวันที่ ${activeWarDate} เรียบร้อย!`);
      };

      const handleRevertMemberSwap = (member) => {
        const woe = activeTab === 'woe';
        const subInfo = getModeTempSub(member, woe);
        if (!subInfo?.active) return;
        const partnerId = subInfo.partnerId;

        updateMembersForActiveDate((prevMembers) => {
          const nextMembers = prevMembers.map((m) => ({ ...m }));
          const memA = nextMembers.find((m) => m.id === member.id);
          const memB = partnerId ? nextMembers.find((m) => m.id === partnerId) : null;

          if (memA && memB) {
            const pA = getModePartyId(memA, woe);
            const sA = getModeSlotIndex(memA, woe);
            const pB = getModePartyId(memB, woe);
            const sB = getModeSlotIndex(memB, woe);

            assignModePlacement(memA, {
              partyId: pB,
              slotIndex: sB,
              isLeader: pB ? sB === 0 : false,
              tempSub: { active: false, originPartyId: null, originGroupId: '', originSubIdx: 0, partnerId: '', partnerName: '' }
            }, woe);

            assignModePlacement(memB, {
              partyId: pA,
              slotIndex: sA,
              isLeader: pA ? sA === 0 : false,
              tempSub: { active: false, originPartyId: null, originGroupId: '', originSubIdx: 0, partnerId: '', partnerName: '' }
            }, woe);
          } else if (memA) {
            assignModePlacement(memA, {
              tempSub: { active: false, originPartyId: null, originGroupId: '', originSubIdx: 0, partnerId: '', partnerName: '' }
            }, woe);
          }
          return nextMembers;
        });

        setTempSubModalMember(null);
        showToast(`คืนตำแหน่งเดิมเรียบร้อยแล้ว!`);
      };

      const handleUpdateGroupText = (groupId, field, value) => {
        const targetKey = activeTab === 'woe' ? 'woeGroups' : 'gvgGroups';
        setData((prev) => ({
          ...prev,
          [targetKey]: (prev[targetKey] || currentModeGroups).map((g) => (g.id === groupId ? { ...g, [field]: value } : g))
        }));
      };

      const handleSetTeamPartyCount = (groupId, targetCount) => {
        const desired = Number(targetCount);
        const groupParties = parties.filter((p) => (activeTab === 'woe' ? p.woeGroup === groupId : p.gvgGroup === groupId));
        if (desired === groupParties.length) return;
        if (desired < groupParties.length) {
          const occupied = groupParties.slice(desired).filter((p) => (partyMembersMap.map[p.id] || []).some(Boolean));
          if (occupied.length > 0) {
            setAlertModalInfo({ title: 'ไม่สามารถลดจำนวนปาร์ตี้ได้', message: `ในปาร์ตี้ (${occupied.map((p) => p.customNum || p.note).join(', ')}) ยังมีสมาชิกอยู่ กรุณาเคลียร์คนออกจากตี้ให้ว่างก่อนครับ` });
            return;
          }
        }
        setData((prev) => {
          const gParties = prev.parties.filter((p) => (activeTab === 'woe' ? p.woeGroup === groupId : p.gvgGroup === groupId));
          if (desired > gParties.length) {
            let maxId = prev.parties.reduce((max, p) => Math.max(max, p.id), 0);
            const added = [];
            for (let i = 1; i <= desired - gParties.length; i++) {
              maxId += 1;
              const numIdx = gParties.length + i;
              added.push({ id: maxId, subIdx: numIdx, customNum: `ปาร์ตี้ ${numIdx}`, name: `ปาร์ตี้ ${numIdx}`, note: '', lane: 'รอฟังคำสั่ง', gvgGroup: groupId, woeGroup: groupId });
            }
            return { ...prev, parties: [...prev.parties, ...added] };
          } else {
            const removeIds = gParties.slice(desired).map((p) => p.id);
            return { ...prev, parties: prev.parties.filter((p) => !removeIds.includes(p.id)) };
          }
        });
      };

      const handleAddNewTeam = () => {
        const targetKey = activeTab === 'woe' ? 'woeGroups' : 'gvgGroups';
        const existingGroups = data[targetKey] || currentModeGroups;
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        let nextLetter = 'F';
        for (let i = 0; i < alphabet.length; i++) {
          if (!existingGroups.some((g) => g.id === alphabet[i])) { nextLetter = alphabet[i]; break; }
        }
        const newId = existingGroups.some((g) => g.id === nextLetter) ? `T${existingGroups.length + 1}` : nextLetter;
        const newGroup = makeGroup(newId, `TEAM ${newId}`, '#0284c7', 'linear-gradient(90deg, #0284c7 0%, #0369a1 60%, #1e293b 100%)', '#0c4a6e');
        setData((prev) => {
          let maxId = prev.parties.reduce((max, p) => Math.max(max, p.id), 0);
          const addedParties = [1, 2, 3, 4].map((s) => ({ id: ++maxId, subIdx: s, customNum: `ปาร์ตี้ ${s}`, name: `ปาร์ตี้ ${s}`, note: '', lane: 'รอฟังคำสั่ง', gvgGroup: newId, woeGroup: newId }));
          return { ...prev, [targetKey]: [...existingGroups, newGroup], parties: [...prev.parties, ...addedParties] };
        });
        showToast(`+ เพิ่ม TEAM ${newId} เรียบร้อยแล้ว`);
      };

      const executeDeleteTeam = () => {
        if (!confirmDeleteGroup) return;
        const groupId = confirmDeleteGroup.id;
        const groupName = confirmDeleteGroup.name;
        const targetKey = activeTab === 'woe' ? 'woeGroups' : 'gvgGroups';
        const isWoe = activeTab === 'woe';

        setData((prev) => {
          const targetPartyIds = prev.parties.filter((p) => (isWoe ? p.woeGroup === groupId : p.gvgGroup === groupId)).map((p) => p.id);
          const updatedMembers = prev.members.map((m) => {
            const nextM = { ...m };
            if (isWoe) {
              if (targetPartyIds.includes(getModePartyId(nextM, true))) {
                assignModePlacement(nextM, { partyId: null, slotIndex: 0, isLeader: false }, true);
              }
            } else {
              if (targetPartyIds.includes(getModePartyId(nextM, false))) {
                assignModePlacement(nextM, { partyId: null, slotIndex: 0, isLeader: false }, false);
              }
            }
            return nextM;
          });
          const curDate = prev.activeWarDate || todayDefaultStr;
          return {
            ...prev,
            [targetKey]: (prev[targetKey] || currentModeGroups).filter((g) => g.id !== groupId),
            parties: prev.parties.filter((p) => !targetPartyIds.includes(p.id)),
            members: updatedMembers,
            lineupsByDate: { ...(prev.lineupsByDate || {}), [curDate]: serializeMemberLineup(updatedMembers) }
          };
        });
        if (selectedTeamFilter === groupId) setSelectedTeamFilter('ALL');
        setConfirmDeleteGroup(null);
        showToast(`ลบ "${groupName}" ออกจากระบบเรียบร้อยแล้ว`);
      };

      const openTeamActionModal = (sourceGroup) => {
        const otherSame = currentModeGroups.filter((g) => g.id !== sourceGroup.id);
        setTeamActionSourceGroup(sourceGroup);
        setTeamActionType('SWAP_SAME_MODE');
        setTeamActionTargetId(otherSame[0]?.id || 'A');
      };

      const executeTeamAction = () => {
        if (!teamActionSourceGroup || !teamActionTargetId) return;
        const srcId = teamActionSourceGroup.id;
        const dstId = teamActionTargetId;
        const isWoe = activeTab === 'woe';

        if (teamActionType === 'SWAP_SAME_MODE') {
          setData((prev) => ({
            ...prev,
            parties: prev.parties.map((p) => {
              const currentG = isWoe ? p.woeGroup : p.gvgGroup;
              if (currentG === srcId) return isWoe ? { ...p, woeGroup: dstId } : { ...p, gvgGroup: dstId };
              if (currentG === dstId) return isWoe ? { ...p, woeGroup: srcId } : { ...p, gvgGroup: srcId };
              return p;
            })
          }));
          showToast(`สลับยกทีมเรียบร้อยแล้ว!`);
        } else if (teamActionType === 'COPY_TO_WOE') {
          // ข้อ 1: ก็อปปี้ทั้งปาร์ตี้และตำแหน่งสมาชิกจาก GVG ไปยังทีมเป้าหมายในโหมดศึกชิงปราสาท
          setData((prev) => {
            const srcParties = prev.parties.filter((p) => p.gvgGroup === srcId);
            const srcPartyIds = new Set(srcParties.map((p) => p.id));
            const nextParties = prev.parties.map((p) => {
              if (srcPartyIds.has(p.id)) return { ...p, woeGroup: dstId };
              if (p.woeGroup === dstId && !srcPartyIds.has(p.id)) return { ...p, woeGroup: srcId };
              return p;
            });
            const nextMembers = prev.members.map((m) => {
              if (srcPartyIds.has(m.partyId)) {
                return {
                  ...m,
                  woePartyId: m.partyId,
                  woeSlotIndex: m.slotIndex ?? 0,
                  woeIsLeader: !!m.isLeader
                };
              }
              return m;
            });
            const curDate = prev.activeWarDate || todayDefaultStr;
            return {
              ...prev,
              parties: nextParties,
              members: nextMembers,
              lineupsByDate: { ...(prev.lineupsByDate || {}), [curDate]: serializeMemberLineup(nextMembers) }
            };
          });
          showToast(`ก็อปปี้ผัง "${teamActionSourceGroup.name}" ไปใส่ TEAM ${dstId} โหมดศึกชิงปราสาทเรียบร้อย!`);
        }
        setTeamActionSourceGroup(null);
      };

      const handleRequestClearOrDeleteParty = (party) => {
        const activeCount = (partyMembersMap.map[party.id] || []).filter(Boolean).length;
        setConfirmClearParty({
          id: party.id,
          note: `${party.customNum || ''} ${party.note || ''}`.trim() || 'ปาร์ตี้นี้',
          count: activeCount,
          mode: activeCount > 0 ? 'CLEAR' : 'DELETE'
        });
      };

      const executeClearSingleParty = () => {
        if (!confirmClearParty) return;
        const woe = activeTab === 'woe';
        if (confirmClearParty.mode === 'DELETE') {
          setData((prev) => ({ ...prev, parties: prev.parties.filter((p) => p.id !== confirmClearParty.id) }));
          showToast(`ลบ "${confirmClearParty.note}" เรียบร้อยแล้ว`);
        } else {
          updateMembersForActiveDate((prevMembers) =>
            prevMembers.map((m) => {
              if (getModePartyId(m, woe) === confirmClearParty.id) {
                const nextM = { ...m };
                assignModePlacement(nextM, { partyId: null, slotIndex: 0, isLeader: false }, woe);
                return nextM;
              }
              return m;
            })
          );
          showToast('ล้างตี้ในโหมดนี้เรียบร้อยแล้ว');
        }
        setConfirmClearParty(null);
      };

      const handleRemoveMemberFromParty = (memberId) => {
        const target = members.find((m) => m.id === memberId);
        if (!target) return;
        setConfirmRemoveFromPartyMember(target);
      };

      const executeRemoveMemberFromParty = () => {
        if (!confirmRemoveFromPartyMember) return;
        const memberId = confirmRemoveFromPartyMember.id;
        const woe = activeTab === 'woe';
        updateMembersForActiveDate((prevMembers) =>
          prevMembers.map((m) => {
            if (m.id === memberId) {
              const nextM = { ...m };
              assignModePlacement(nextM, { partyId: null, slotIndex: 0, isLeader: false }, woe);
              return nextM;
            }
            return m;
          })
        );
        if (selectedSlot?.memberId === memberId) setSelectedSlot(null);
        showToast(`นำ "${confirmRemoveFromPartyMember.name}" ออกจากตี้เรียบร้อยแล้ว`);
        setConfirmRemoveFromPartyMember(null);
      };

      // ข้อ 1: ย้าย/สลับคนในปาร์ตี้ แยกอิสระตามโหมด GVG และ WOE
      const swapOrMoveMember = (source, target) => {
        if (!source || !target) return;
        if (source.partyId === target.partyId && source.slotIndex === target.slotIndex && source.memberId === target.memberId) { setSelectedSlot(null); return; }
        const woe = activeTab === 'woe';
        updateMembersForActiveDate((prevMembers) => {
          const nextMembers = prevMembers.map((m) => ({ ...m }));
          const sourceMember = nextMembers.find((m) => m.id === source.memberId);
          const targetMember = target.memberId
            ? nextMembers.find((m) => m.id === target.memberId)
            : target.partyId
            ? nextMembers.find((m) => getModePartyId(m, woe) === target.partyId && getModeSlotIndex(m, woe) === target.slotIndex)
            : null;

          if (sourceMember && targetMember) {
            const tp = getModePartyId(sourceMember, woe);
            const ts = getModeSlotIndex(sourceMember, woe);
            const targetPid = target.partyId;
            const targetSlot = target.slotIndex;

            assignModePlacement(sourceMember, { partyId: targetPid, slotIndex: targetSlot, isLeader: targetPid ? targetSlot === 0 : false }, woe);
            assignModePlacement(targetMember, { partyId: tp, slotIndex: ts, isLeader: tp ? ts === 0 : false }, woe);
          } else if (sourceMember && !targetMember) {
            assignModePlacement(sourceMember, { partyId: target.partyId, slotIndex: target.slotIndex ?? 0, isLeader: target.partyId ? target.slotIndex === 0 : false }, woe);
          }
          return nextMembers;
        });
        setSelectedSlot(null);
      };

      const handleSlotClick = (partyId, slotIndex, member) => {
        if (isGuildView) return;
        if (!selectedSlot) { if (member) setSelectedSlot({ partyId, slotIndex, memberId: member.id, memberName: member.name }); }
        else swapOrMoveMember(selectedSlot, { partyId, slotIndex, memberId: member ? member.id : null });
      };

      const handleUnassignedMemberClick = (member) => {
        if (isGuildView) return;
        if (selectedSlot && selectedSlot.memberId === member.id) setSelectedSlot(null);
        else if (selectedSlot && selectedSlot.partyId) swapOrMoveMember(selectedSlot, { partyId: null, slotIndex: 0, memberId: member.id });
        else setSelectedSlot({ partyId: null, slotIndex: 0, memberId: member.id, memberName: member.name });
      };

      // ข้อ 1: จัดตี้สมดุลอัตโนมัติ เฉพาะโหมดที่กำลังเปิดอยู่
      const handleAutoBalanceByRoleAndCP = () => {
        const woe = activeTab === 'woe';
        updateMembersForActiveDate((prevMembers, prevState) => {
          const validGroupIds = new Set((woe ? (prevState.woeGroups || DEFAULT_WOE_GROUPS) : (prevState.gvgGroups || DEFAULT_GVG_GROUPS)).map((g) => g.id));
          const modeParties = prevState.parties.filter((p) => validGroupIds.has(woe ? p.woeGroup : p.gvgGroup));
          const totalP = modeParties.length;
          if (!totalP || prevMembers.length === 0) return prevMembers;

          const sorted = [...prevMembers].sort((a, b) => b.cp - a.cp);
          const priests = sorted.filter((m) => m.job === 'High Priest');
          const tanks = sorted.filter((m) => (jobMap[m.job]?.role || 'DPS') === 'Tank');
          const supports = sorted.filter((m) => m.job !== 'High Priest' && (jobMap[m.job]?.role || 'DPS') === 'Support');
          const dps = sorted.filter((m) => m.job !== 'High Priest' && (jobMap[m.job]?.role || 'DPS') === 'DPS');

          const slots = Array.from({ length: totalP }, () => []);
          for (let i = 0; i < totalP && priests.length > 0; i++) slots[i].push(priests.shift());
          for (let i = 0; i < totalP && tanks.length > 0; i++) slots[i].push(tanks.shift());
          for (let i = 0; i < totalP && supports.length > 0; i++) { if (slots[i].length < 5) slots[i].push(supports.shift()); }
          const rem = [...priests, ...tanks, ...supports, ...dps].sort((a, b) => b.cp - a.cp);
          for (let i = 0; i < totalP; i++) { while (slots[i].length < 5 && rem.length > 0) slots[i].push(rem.shift()); }

          const placementByMemberId = {};
          slots.forEach((sArr, pIdx) => {
            const pid = modeParties[pIdx]?.id;
            sArr.forEach((m, sIdx) => {
              if (m && pid) placementByMemberId[m.id] = { partyId: pid, slotIndex: sIdx, isLeader: sIdx === 0 };
            });
          });
          rem.forEach((m) => {
            placementByMemberId[m.id] = { partyId: null, slotIndex: 0, isLeader: false };
          });

          return prevMembers.map((m) => {
            const nextM = { ...m };
            const pl = placementByMemberId[m.id] || { partyId: null, slotIndex: 0, isLeader: false };
            assignModePlacement(nextM, pl, woe);
            return nextM;
          });
        });
        showToast(`จัดตี้สมดุลตามบทบาทและค่าพลัง (${woe ? 'โหมดศึกชิงปราสาท' : 'โหมด Guild League'}) เรียบร้อย!`);
      };

      const openGroupSettingsModal = (group) => {
        openMasterSettings('war', group.id);
      };

      const handleSaveGroupSettings = (e) => {
        e.preventDefault();
        if (!teamSettingsGroup) return;
        const targetKey = activeTab === 'woe' ? 'woeGroups' : 'gvgGroups';
        setData((prev) => ({
          ...prev,
          [targetKey]: (prev[targetKey] || currentModeGroups).map((g) =>
            g.id === teamSettingsGroup.id ? { ...g, ...editGroupForm, bannerGradient: `linear-gradient(90deg, ${editGroupForm.accent} 0%, ${editGroupForm.accent}dd 60%, #1e293b 100%)` } : g
          )
        }));
        setTeamSettingsGroup(null);
        showToast('บันทึกการตั้งค่าทีมเรียบร้อยแล้ว');
      };

      const polarityStats = useMemo(() => {
        const w1List = [], w2List = [], w3List = [];
        let noStarCount = 0;
        members.forEach((m) => {
          const p = m.polarity || { w1: false, w2: false, w3: false };
          if (p.w1) w1List.push(m);
          else if (p.w2) w2List.push(m);
          else if (p.w3) w3List.push(m);
          else noStarCount += 1;
        });
        return { w1List, w2List, w3List, noStarCount };
      }, [members]);

      const togglePolarityWeek = (memberId, weekKey, askConfirmIfRemoving = false) => {
        const target = members.find((m) => m.id === memberId);
        if (!target) return;
        const isChecked = !!target.polarity?.[weekKey];
        if (isChecked && askConfirmIfRemoving) {
          setConfirmRemovePolarityWeek({ member: target, weekKey });
          return;
        }
        setData((prev) => {
          const t = prev.members.find((m) => m.id === memberId);
          if (!t) return prev;
          const cur = !!t.polarity?.[weekKey];
          if (!cur && prev.members.filter((m) => m.polarity?.[weekKey]).length >= 50) { showToast('สัปดาห์นี้เต็ม 50 คนแล้ว!'); return prev; }
          return {
            ...prev,
            members: prev.members.map((m) =>
              m.id !== memberId ? m : { ...m, polarity: { w1: weekKey === 'w1' ? !cur : false, w2: weekKey === 'w2' ? !cur : false, w3: weekKey === 'w3' ? !cur : false } }
            )
          };
        });
      };

      const handleAutoAssignPolarity3Weeks = () => {
        setData((prev) => {
          const sorted = [...prev.members].sort((a, b) => b.cp - a.cp);
          const next = prev.members.map((m) => ({ ...m, polarity: { w1: false, w2: false, w3: false } }));
          let c1 = 0, c2 = 0, c3 = 0;
          sorted.forEach((sm, idx) => {
            const t = next.find((x) => x.id === sm.id);
            if (t) {
              if (idx % 3 === 0 && c1 < 50) { t.polarity.w1 = true; c1++; }
              else if (idx % 3 === 1 && c2 < 50) { t.polarity.w2 = true; c2++; }
              else if (c3 < 50) { t.polarity.w3 = true; c3++; }
            }
          });
          return { ...prev, members: next };
        });
        showToast('แบ่งเวร 3 สัปดาห์อัตโนมัติเรียบร้อย!');
      };

      const matchesFilterObj = (m, fObj) => {
        const q = (fObj.search || '').trim().toLowerCase();
        if (q) {
          const nameMatch = (m.name || '').toLowerCase().includes(q);
          const grpVal = (m.group || '').toLowerCase();
          const groupMatch = grpVal && (grpVal === q || `กลุ่ม ${grpVal}` === q || `กลุ่ม${grpVal}` === q);
          if (!nameMatch && !groupMatch) return false;
        }
        if (fObj.job !== 'ALL' && m.job !== fObj.job) return false;
        if (fObj.role !== 'ALL' && (jobMap[m.job]?.role || 'DPS') !== fObj.role) return false;
        if (fObj.group && fObj.group !== 'ALL') {
          if (fObj.group === 'HAS_GROUP' && !m.group) return false;
          if (fObj.group === 'NONE' && m.group) return false;
          if (fObj.group !== 'HAS_GROUP' && fObj.group !== 'NONE' && (m.group || '') !== fObj.group) return false;
        }
        if (fObj.dot && fObj.dot !== 'ALL') {
          if (fObj.dot === 'NONE' && m.dotColor) return false;
          if (fObj.dot !== 'NONE' && (m.dotColor || '') !== fObj.dot) return false;
        }
        if (fObj.tempSub) {
          const curSub = getModeTempSub(m);
          if (!curSub?.active) return false;
        }
        return true;
      };

      const filteredUnassigned = useMemo(() => partyMembersMap.unassigned.filter((m) => matchesFilterObj(m, tabFilters.party)), [partyMembersMap.unassigned, tabFilters.party, jobMap, activeTab]);

      const sortMembersByOption = (list, sortOpt) => {
        return [...list].sort((a, b) => {
          if (sortOpt === 'NAME_ASC') return (a.name || '').localeCompare(b.name || '', 'th');
          if (sortOpt === 'NAME_DESC') return (b.name || '').localeCompare(a.name || '', 'th');
          if (sortOpt === 'JOB_ASC') {
            const cmp = (a.job || '').localeCompare(b.job || '', 'th');
            return cmp !== 0 ? cmp : (a.name || '').localeCompare(b.name || '', 'th');
          }
          if (sortOpt === 'JOB_DESC') {
            const cmp = (b.job || '').localeCompare(a.job || '', 'th');
            return cmp !== 0 ? cmp : (a.name || '').localeCompare(b.name || '', 'th');
          }
          if (sortOpt === 'CP_DESC') return (b.cp || 0) - (a.cp || 0);
          if (sortOpt === 'CP_ASC') return (a.cp || 0) - (b.cp || 0);
          if (sortOpt === 'GROUP_ASC') {
            const gA = a.group || 'ZZZ';
            const gB = b.group || 'ZZZ';
            if (gA !== gB) return gA.localeCompare(gB);
            return (a.sheetId || 0) - (b.sheetId || 0);
          }
          if (sortOpt === 'DOT_ASC') {
            const order = { red: 1, yellow: 2, green: 3, '': 4 };
            const dA = order[a.dotColor || ''] || 4;
            const dB = order[b.dotColor || ''] || 4;
            if (dA !== dB) return dA - dB;
            return (a.sheetId || 0) - (b.sheetId || 0);
          }
          if (sortOpt === 'ID_DESC') return (b.sheetId || 0) - (a.sheetId || 0);
          return (a.sheetId || 0) - (b.sheetId || 0);
        });
      };

      const toggleColumnSort = (currentSort, ascKey, descKey) => {
        return currentSort === ascKey ? descKey : ascKey;
      };

      const filteredMembersList = useMemo(() => {
        const fObj = tabFilters[currentTabKey] || tabFilters.party;
        const list = members.filter((m) => {
          if (!matchesFilterObj(m, fObj)) return false;
          if (activeTab === 'polarity') {
            const p = m.polarity || {};
            if (polarityFilter === 'W1' && !p.w1) return false;
            if (polarityFilter === 'W2' && !p.w2) return false;
            if (polarityFilter === 'W3' && !p.w3) return false;
            if (polarityFilter === 'NONE' && (p.w1 || p.w2 || p.w3)) return false;
          }
          return true;
        });

        if (activeTab === 'polarity') return sortMembersByOption(list, polaritySortBy);
        if (activeTab === 'roster') return sortMembersByOption(list, rosterSortBy);
        return list;
      }, [members, tabFilters, currentTabKey, jobMap, activeTab, polarityFilter, polaritySortBy, rosterSortBy]);

      const jobCountsList = useMemo(() => {
        const counts = {};
        jobClasses.forEach((j) => { counts[j.id] = 0; });
        members.forEach((m) => { counts[m.job] = (counts[m.job] || 0) + 1; });
        const maxC = Math.max(1, ...Object.values(counts));
        return jobClasses.map((j) => ({ ...j, count: counts[j.id] || 0, pct: Math.round(((counts[j.id] || 0) / maxC) * 100) })).sort((a, b) => b.count - a.count);
      }, [members, jobClasses]);

      const filteredSwapCandidates = useMemo(() => {
        if (!tempSubModalMember) return [];
        const woe = activeTab === 'woe';
        return members
          .filter((m) => {
            if (m.id === tempSubModalMember.id) return false;
            if (swapSearchText.trim()) {
              const q = swapSearchText.trim().toLowerCase();
              const nameMatch = m.name.toLowerCase().includes(q);
              const grpVal = (m.group || '').toLowerCase();
              const groupMatch = grpVal && (grpVal === q || `กลุ่ม ${grpVal}` === q || `กลุ่ม${grpVal}` === q);
              if (!nameMatch && !groupMatch) return false;
            }
            if (swapJobFilter !== 'ALL' && m.job !== swapJobFilter) return false;
            if (swapGroupFilter !== 'ALL') {
              if (swapGroupFilter === 'HAS_GROUP' && !m.group) return false;
              if (swapGroupFilter === 'NONE' && m.group) return false;
              if (swapGroupFilter !== 'HAS_GROUP' && swapGroupFilter !== 'NONE' && (m.group || '') !== swapGroupFilter) return false;
            }
            if (swapTeamFilter !== 'ALL') {
              const candPid = getModePartyId(m, woe);
              if (swapTeamFilter === 'UNASSIGNED') { if (candPid) return false; }
              else {
                const pObj = parties.find((p) => p.id === candPid);
                const gId = pObj ? (woe ? pObj.woeGroup : pObj.gvgGroup) : '';
                if (gId !== swapTeamFilter) return false;
              }
            }
            return true;
          })
          .sort((a, b) => b.cp - a.cp);
      }, [members, tempSubModalMember, swapSearchText, swapJobFilter, swapGroupFilter, swapTeamFilter, parties, activeTab]);

      const toggleSelectRosterMember = (memberId) => {
        setSelectedRosterIds((prev) =>
          prev.includes(memberId) ? prev.filter((id) => id !== memberId) : [...prev, memberId]
        );
      };

      const toggleSelectAllFilteredRoster = () => {
        const visibleIds = filteredMembersList.map((m) => m.id);
        if (visibleIds.length === 0) return;
        const allSelected = visibleIds.every((id) => selectedRosterIds.includes(id));
        if (allSelected) {
          setSelectedRosterIds((prev) => prev.filter((id) => !visibleIds.includes(id)));
        } else {
          setSelectedRosterIds((prev) => Array.from(new Set([...prev, ...visibleIds])));
        }
      };

      const handleBulkAssignGroup = (groupVal) => {
        if (selectedRosterIds.length === 0) return;
        const idSet = new Set(selectedRosterIds);
        setData((prev) => ({
          ...prev,
          members: prev.members.map((m) => (idSet.has(m.id) ? { ...m, group: groupVal } : m))
        }));
        showToast(
          groupVal
            ? `กำหนด "กลุ่ม ${groupVal}" ให้สมาชิกที่เลือก ${selectedRosterIds.length} คนเรียบร้อย!`
            : `ยกเลิกกลุ่มของสมาชิกที่เลือก ${selectedRosterIds.length} คนเรียบร้อย!`
        );
      };

      const executeBulkDeleteSelectedMembers = () => {
        if (selectedRosterIds.length === 0) return;
        const idSet = new Set(selectedRosterIds);
        const count = selectedRosterIds.length;
        setData((prev) => ({
          ...prev,
          members: prev.members.filter((m) => !idSet.has(m.id))
        }));
        setSelectedRosterIds([]);
        setConfirmBulkDeleteMembers(false);
        showToast(`ลบสมาชิกที่เลือก ${count} คนออกจากระบบเรียบร้อยแล้ว!`);
      };

      // ==========================================
      // ข้อ 3: ระบบนำเข้าและแยกคอลัมน์จาก Google Sheets ตามไฟล์เกมจริง
      // ดึงเฉพาะ ID, ชื่อผู้เล่น, Lv., คลาส/อาชีพ, เพศ, ตำแหน่ง, คะแนน Gear (ตัด Title, แต้มสนับสนุน, ออนไลน์ ทิ้งอัตโนมัติ)
      // ตรวจสอบด้วยชื่อตัวละครเป็นหลัก ไม่เอาลำดับ ID มาทำให้รวน
      // ==========================================
      const normalizeSheetRank = (rawRank) => {
        const s = String(rawRank || '').trim();
        if (!s) return 'สมาชิกทั่วไป';
        if (/รองหัวหน้า/i.test(s)) return 'รองหัวหน้า Guild';
        if (/หัวหน้า/i.test(s)) return 'หัวหน้า Guild';
        if (/ผู้บัญชาการ/i.test(s)) return 'ผู้บัญชาการ';
        if (/charming/i.test(s)) return 'Charming Star';
        if (/captain/i.test(s)) return 'Captain';
        if (/เสมียน/i.test(s)) return 'เสมียน';
        return 'สมาชิกทั่วไป';
      };

      const normalizeSheetJob = (rawJob) => {
        const cleaned = String(rawJob || '').replace(/[▼▾]/g, '').trim();
        if (!cleaned) return 'High Priest';
        const found = jobClasses.find((j) => j.id.toLowerCase() === cleaned.toLowerCase() || j.name.toLowerCase() === cleaned.toLowerCase());
        return found ? found.id : cleaned;
      };

      const recomputeSheetComparison = (parsedRows, currentMembers, manualRenamesMap = {}, removeLeftFlag = false) => {
        const renamedOldIds = new Set(Object.keys(manualRenamesMap));
        const renamedNewNamesLower = new Set(Object.values(manualRenamesMap).map((n) => n.toLowerCase()));

        const matchedList = [];
        const addedList = [];
        const incomingNamesLower = new Set();

        parsedRows.forEach((row) => {
          const lower = row.name.toLowerCase();
          incomingNamesLower.add(lower);

          if (renamedNewNamesLower.has(lower)) {
            return;
          }

          const existing = currentMembers.find((m) => m.name.toLowerCase() === lower && !renamedOldIds.has(m.id));
          if (existing) {
            matchedList.push({ newRow: row, oldMember: existing });
          } else {
            addedList.push(row);
          }
        });

        const leftGuild = currentMembers.filter(
          (m) => !incomingNamesLower.has(m.name.toLowerCase()) && !renamedOldIds.has(m.id)
        );

        const renamePairsList = Object.entries(manualRenamesMap).map(([oldId, newName]) => {
          const oldMem = currentMembers.find((m) => m.id === oldId);
          const newRow = parsedRows.find((r) => r.name.toLowerCase() === newName.toLowerCase());
          return { oldMem, newRow };
        }).filter((x) => x.oldMem && x.newRow);

        return {
          parsedRows,
          matchedList,
          added: addedList,
          leftGuild,
          manualRenamesMap,
          renamePairsList,
          removeLeftMembers: removeLeftFlag
        };
      };

      const handleAnalyzeSheetData = () => {
        if (!sheetRawText.trim()) return;
        const rawLines = sheetRawText
          .trim()
          .split(/\r?\n/)
          .map((line) => line.split('\t').map((c) => c.trim()))
          .filter((cols) => cols.length >= 2 && cols.some(Boolean));

        const parsedRows = [];
        let autoIdCounter = 1;

        rawLines.forEach((cols) => {
          const joinedLine = cols.join(' ');
          if (/รายชื่อจากไฟล์เกม/i.test(joinedLine)) return;
          if (cols.some((c) => /^(ชื่อผู้เล่น|คลาส|คะแนน\s*gear|แต้มสนับสนุน)/i.test(c))) return;

          const nonEmpty = cols.filter((c) => c !== '' && c !== '▼' && c !== '▾');
          if (nonEmpty.length < 2) return;

          const isFirstNumericId = /^\d+$/.test(nonEmpty[0]) && !/^\d+$/.test(nonEmpty[1] || '');
          let sheetId = autoIdCounter;
          let name = '';
          let lv = 93;
          let job = 'High Priest';
          let gender = 'ชาย';
          let rank = 'สมาชิกทั่วไป';
          let cp = 60000;

          const knownJobNamesLower = new Set(jobClasses.map((j) => j.name.toLowerCase()));
          const isRankToken = (str) => /(หัวหน้า|รองหัวหน้า|ผู้บัญชาการ|charming|captain|เสมียน|สมาชิกทั่วไป)/i.test(str);

          if (isFirstNumericId) {
            sheetId = parseInt(nonEmpty[0], 10) || autoIdCounter;
            name = nonEmpty[1] || '';
            const rest = nonEmpty.slice(2);

            let lvFound = false;
            let jobFound = false;
            let genderFound = false;
            let rankFound = false;
            let cpFound = false;

            for (let i = 0; i < rest.length; i++) {
              const tok = rest[i].replace(/[▼▾]/g, '').trim();
              if (!tok) continue;

              if (!lvFound && /^\d{1,3}$/.test(tok)) {
                lv = parseInt(tok, 10);
                lvFound = true;
                continue;
              }
              if (!jobFound && knownJobNamesLower.has(tok.toLowerCase())) {
                job = normalizeSheetJob(tok);
                jobFound = true;
                continue;
              }
              if (!genderFound && (tok === 'ชาย' || tok === 'หญิง')) {
                gender = tok;
                genderFound = true;
                continue;
              }
              if (!rankFound && isRankToken(tok)) {
                rank = normalizeSheetRank(tok);
                rankFound = true;
                continue;
              }
              const cleanNum = tok.replace(/,/g, '');
              if (lvFound && !cpFound && /^\d{4,8}$/.test(cleanNum)) {
                cp = parseInt(cleanNum, 10);
                cpFound = true;
                break; // ข้อมูลหลังคะแนน Gear เช่น กิจกรรมสัปดาห์นี้ แต้มสนับสนุน สถานะออนไลน์ จะถูกข้ามทั้งหมด
              }
            }
          } else {
            name = nonEmpty[0] || '';
            const rest = nonEmpty.slice(1);
            let lvFound = false;
            let jobFound = false;
            let genderFound = false;
            let rankFound = false;
            let cpFound = false;

            for (let i = 0; i < rest.length; i++) {
              const tok = rest[i].replace(/[▼▾]/g, '').trim();
              if (!tok) continue;
              if (!lvFound && /^\d{1,3}$/.test(tok)) {
                lv = parseInt(tok, 10);
                lvFound = true;
                continue;
              }
              if (!jobFound && knownJobNamesLower.has(tok.toLowerCase())) {
                job = normalizeSheetJob(tok);
                jobFound = true;
                continue;
              }
              if (!genderFound && (tok === 'ชาย' || tok === 'หญิง')) {
                gender = tok;
                genderFound = true;
                continue;
              }
              if (!rankFound && isRankToken(tok)) {
                rank = normalizeSheetRank(tok);
                rankFound = true;
                continue;
              }
              const cleanNum = tok.replace(/,/g, '');
              if (lvFound && !cpFound && /^\d{4,8}$/.test(cleanNum)) {
                cp = parseInt(cleanNum, 10);
                cpFound = true;
                break;
              }
            }
          }

          autoIdCounter++;
          if (name && !/^(id|#)$/i.test(name)) {
            parsedRows.push({ sheetId, name, lv, job, gender, rank, cp });
          }
        });

        if (!parsedRows.length) {
          showToast('ไม่พบรูปแบบข้อมูลที่ถูกต้อง กรุณาตรวจสอบข้อมูลที่ก๊อปปี้มา');
          return;
        }

        const diff = recomputeSheetComparison(parsedRows, members, {}, false);
        setSheetDiffResult(diff);
        setRenameSourceOldId(diff.leftGuild[0]?.id || '');
        setRenameTargetNewName(diff.added[0]?.name || '');
      };

      // ข้อ 3: จับคู่คนเปลี่ยนชื่อแล้วไม่ได้แจ้ง (โอนย้ายตี้ กลุ่ม และสถานะเดิมไปยังชื่อใหม่ทันที)
      const handleAddManualRenamePair = () => {
        if (!sheetDiffResult || !renameSourceOldId || !renameTargetNewName) return;
        const nextMap = {
          ...(sheetDiffResult.manualRenamesMap || {}),
          [renameSourceOldId]: renameTargetNewName
        };
        const nextDiff = recomputeSheetComparison(
          sheetDiffResult.parsedRows,
          members,
          nextMap,
          sheetDiffResult.removeLeftMembers
        );
        setSheetDiffResult(nextDiff);
        setRenameSourceOldId(nextDiff.leftGuild[0]?.id || '');
        setRenameTargetNewName(nextDiff.added[0]?.name || '');
        showToast('จับคู่คนเปลี่ยนชื่อเรียบร้อย! (ตี้และกลุ่มเดิมจะถูกคงไว้ 100%)');
      };

      const handleRemoveManualRenamePair = (oldId) => {
        if (!sheetDiffResult) return;
        const nextMap = { ...(sheetDiffResult.manualRenamesMap || {}) };
        delete nextMap[oldId];
        const nextDiff = recomputeSheetComparison(
          sheetDiffResult.parsedRows,
          members,
          nextMap,
          sheetDiffResult.removeLeftMembers
        );
        setSheetDiffResult(nextDiff);
      };

      const handleRequestDeleteFromSheetModal = (memberObj) => {
        setConfirmDeleteMember(memberObj);
      };

      const executeDeleteSingleMember = () => {
        if (!confirmDeleteMember) return;
        const targetId = confirmDeleteMember.id;
        const targetName = confirmDeleteMember.name;
        const updatedMembersList = members.filter((m) => m.id !== targetId);

        setData((prev) => ({
          ...prev,
          members: prev.members.filter((m) => m.id !== targetId),
          leaveByDate: Object.fromEntries(
            Object.entries(prev.leaveByDate || {}).map(([k, list]) => [k, (list || []).filter((item) => item.memberId !== targetId)])
          )
        }));
        setSelectedRosterIds((prev) => prev.filter((id) => id !== targetId));
        if (sheetDiffResult) {
          const nextMap = { ...(sheetDiffResult.manualRenamesMap || {}) };
          delete nextMap[targetId];
          setSheetDiffResult(
            recomputeSheetComparison(
              sheetDiffResult.parsedRows,
              updatedMembersList,
              nextMap,
              sheetDiffResult.removeLeftMembers
            )
          );
        }
        setConfirmDeleteMember(null);
        showToast(`ลบ "${targetName}" ออกจากระบบฐานข้อมูลเรียบร้อยแล้ว!`);
      };

      const handleApplySheetSync = () => {
        if (!sheetDiffResult) return;
        const { parsedRows, manualRenamesMap = {}, removeLeftMembers } = sheetDiffResult;

        setData((prev) => {
          let nextMembers = prev.members.map((m) => ({ ...m }));
          const matchedMemberIds = new Set();

          // 1. อัปเดตคนที่จับคู่เปลี่ยนชื่อก่อน (คงตี้ทั้ง GVG/WOE และกลุ่มเดิมไว้ทั้งหมด)
          Object.entries(manualRenamesMap).forEach(([oldId, newName]) => {
            const targetMem = nextMembers.find((m) => m.id === oldId);
            const row = parsedRows.find((r) => r.name.toLowerCase() === newName.toLowerCase());
            if (targetMem && row) {
              matchedMemberIds.add(targetMem.id);
              Object.assign(targetMem, {
                sheetId: row.sheetId,
                name: row.name,
                lv: row.lv,
                job: row.job,
                gender: row.gender,
                rank: row.rank,
                cp: row.cp
              });
            }
          });

          // 2. อัปเดตคนที่มีชื่อตรงกัน (เช็คจากชื่อตัวละคร ไม่ยึดติดลำดับ ID) หรือเพิ่มเป็นสมาชิกใหม่
          const renamedNewNamesLower = new Set(Object.values(manualRenamesMap).map((n) => n.toLowerCase()));

          parsedRows.forEach((row) => {
            if (renamedNewNamesLower.has(row.name.toLowerCase())) return;

            const ex = nextMembers.find(
              (m) => m.name.toLowerCase() === row.name.toLowerCase() && !matchedMemberIds.has(m.id)
            );
            if (ex) {
              matchedMemberIds.add(ex.id);
              Object.assign(ex, {
                sheetId: row.sheetId,
                name: row.name,
                lv: row.lv,
                job: row.job,
                gender: row.gender,
                rank: row.rank,
                cp: row.cp
              });
            } else {
              const nid = `tmz-${Date.now()}-${row.sheetId}-${Math.random().toString(36).slice(2, 6)}`;
              matchedMemberIds.add(nid);
              nextMembers.push({
                id: nid,
                sheetId: row.sheetId,
                name: row.name,
                lv: row.lv,
                job: row.job,
                gender: row.gender,
                rank: row.rank,
                cp: row.cp,
                group: '',
                dotColor: 'green',
                partyId: null,
                slotIndex: 0,
                isLeader: false,
                tempSub: { active: false },
                woePartyId: null,
                woeSlotIndex: 0,
                woeIsLeader: false,
                woeTempSub: { active: false },
                polarity: { w1: false, w2: false, w3: false }
              });
            }
          });

          if (removeLeftMembers) {
            nextMembers = nextMembers.filter((m) => matchedMemberIds.has(m.id));
          }

          const curDate = prev.activeWarDate || todayDefaultStr;
          return {
            ...prev,
            members: nextMembers,
            lineupsByDate: {
              ...(prev.lineupsByDate || {}),
              [curDate]: serializeMemberLineup(nextMembers)
            }
          };
        });

        setIsSheetSyncOpen(false);
        setSheetDiffResult(null);
        setSheetRawText('');
        showToast('อัปเดตข้อมูลจากชีตเรียบร้อยแล้ว!');
      };

      const openAddMemberModal = (defaultPartyId = 0) => {
        setEditingMember(null);
        setFormSheetId(members.reduce((max, m) => Math.max(max, m.sheetId || 0), 0) + 1);
        setFormName(''); setFormLv(93); setFormJob('High Priest'); setFormGender('ชาย'); setFormRank('สมาชิกทั่วไป'); setFormCp(65000); setFormGroup(''); setFormDotColor(''); setFormPartyId(defaultPartyId || 0);
        setIsMemberModalOpen(true);
      };

      const openEditMemberModal = (member) => {
        setEditingMember(member);
        setFormSheetId(member.sheetId || 1); setFormName(member.name); setFormLv(member.lv || 93); setFormJob(member.job || 'High Priest'); setFormGender(member.gender || 'ชาย'); setFormRank(member.rank || 'สมาชิกทั่วไป'); setFormCp(member.cp || 65000); setFormGroup(member.group || ''); setFormDotColor(member.dotColor || ''); setFormPartyId(getModePartyId(member) || 0);
        setIsMemberModalOpen(true);
      };

      const handleSaveMember = (e) => {
        e.preventDefault();
        if (!formName.trim()) return;
        const targetPid = Number(formPartyId) > 0 ? Number(formPartyId) : null;
        if (editingMember) {
          setData((prev) => ({
            ...prev,
            members: prev.members.map((m) => (m.id === editingMember.id ? { ...m, sheetId: Number(formSheetId), name: formName.trim(), lv: Number(formLv), job: formJob, gender: formGender, rank: formRank, cp: Number(formCp), group: formGroup || '', dotColor: formDotColor || '', partyId: targetPid } : m))
          }));
        } else {
          setData((prev) => ({
            ...prev,
            members: [...prev.members, { id: `tmz-${Date.now()}`, sheetId: Number(formSheetId), name: formName.trim(), lv: Number(formLv), job: formJob, gender: formGender, rank: formRank, cp: Number(formCp), group: formGroup || '', dotColor: formDotColor || '', partyId: targetPid, slotIndex: 0, isLeader: false, tempSub: { active: false }, woePartyId: targetPid, woeSlotIndex: 0, woeIsLeader: false, woeTempSub: { active: false }, polarity: { w1: false, w2: false, w3: false } }]
          }));
        }
        setIsMemberModalOpen(false);
        showToast('บันทึกข้อมูลสมาชิกเรียบร้อยแล้ว');
      };

      const handleInlineMemberChange = (memberId, field, value) => {
        setData((prev) => ({ ...prev, members: prev.members.map((m) => (m.id === memberId ? { ...m, [field]: value } : m)) }));
      };

      const handleLogoFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const resUrl = ev.target.result;
          setEditHeaderConfig((p) => ({ ...p, logoUrl: resUrl }));
          setData((prev) => ({ ...prev, headerConfig: { ...(prev.headerConfig || DEFAULT_HEADER_CONFIG), logoUrl: resUrl } }));
        };
        reader.readAsDataURL(file);
      };

      const handleJobIconUpload = (jobId, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          setJobClasses((prev) => prev.map((j) => (j.id === jobId ? { ...j, customIcon: dataUrl } : j)));
          showToast(`อัปโหลดไอคอนอาชีพ "${jobId}" เรียบร้อยแล้ว!`);
        };
        reader.readAsDataURL(file);
      };

      const handleRemoveJobCustomIcon = (jobId) => {
        setJobClasses((prev) => prev.map((j) => (j.id === jobId ? { ...j, customIcon: '' } : j)));
        showToast(`คืนค่าไอคอนมาตรฐานของ "${jobId}" เรียบร้อย!`);
      };

      const handleAddCustomJobClass = () => {
        const trimmed = newJobNameInput.trim();
        if (!trimmed) return;
        if (jobClasses.some((j) => j.id.toLowerCase() === trimmed.toLowerCase())) { showToast('มีอาชีพนี้อยู่แล้ว'); return; }

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                      {/* ฝั่งซ้าย: สมาชิกเดิมที่ไม่มีชื่อในชีต (คนออกกิลด์) */}
                      <div className="border-2 border-rose-400 rounded-2xl overflow-hidden flex flex-col bg-rose-50/40 dark:bg-rose-950/20">
                        <div className="px-4 py-3 bg-rose-600 text-white flex flex-wrap items-center justify-between gap-2">
                          <span className="font-black text-sm">
                            ❌ ไม่มีชื่อในชีตใหม่ / ออกจากกิลด์ ({sheetDiffResult.leftGuild.length} คน)
                          </span>
                          {sheetDiffResult.leftGuild.length > 0 && (
                            <label className="flex items-center gap-1.5 bg-black/25 px-2.5 py-1 rounded-lg font-extrabold text-xs cursor-pointer">
                              <input
                                type="checkbox"
                                checked={!!sheetDiffResult.removeLeftMembers}
                                onChange={(e) => setSheetDiffResult((p) => ({ ...p, removeLeftMembers: e.target.checked }))}
                                className="rounded accent-amber-400 w-4 h-4"
                              />
                              <span>ลบที่เหลือทั้งหมดเมื่อกดยืนยันนำเข้า</span>
                            </label>
                          )}
                        </div>
                        <div className="p-3 space-y-2 max-h-72 overflow-y-auto flex-1">
                          {sheetDiffResult.leftGuild.length === 0 ? (
                            <div className="py-8 text-center text-slate-400 font-bold">
                              ✓ สมาชิกเดิมทุกคนมีชื่ออยู่ในชีตครบถ้วน
                            </div>
                          ) : (
                            sheetDiffResult.leftGuild.map((m) => (
                              <div key={m.id} className="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-rose-200 dark:border-rose-800 shadow-sm">
                                <div className="min-w-0">
                                  <div className="font-black text-sm text-rose-700 dark:text-rose-300 truncate">
                                    {m.name}
                                    {m.group && <span className="ml-1.5 px-1.5 py-0.2 rounded bg-indigo-500/15 text-indigo-600 text-[10px]">กลุ่ม {m.group}</span>}
                                  </div>
                                  <div className="text-[11px] text-slate-500">
                                    {m.job} · Lv.{m.lv || 93} · Gear {(m.cp || 0).toLocaleString()}
                                  </div>
                                </div>
                                <button
                                  type="button"
                                  onClick={() => handleRequestDeleteFromSheetModal(m)}
                                  className="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold shrink-0"
                                >
                                  ลบออกจากระบบทันที
                                </button>
                              </div>
                            ))
                          )}
                        </div>
                      </div>

                      {/* ฝั่งขวา: สมาชิกใหม่ในชีต (ที่ยังไม่มีในระบบ) */}
                      <div className="border-2 border-emerald-500 rounded-2xl overflow-hidden flex flex-col bg-emerald-50/40 dark:bg-emerald-950/20">
                        <div className="px-4 py-3 bg-emerald-600 text-white flex items-center justify-between">
                          <span className="font-black text-sm">
                            ✨ รายชื่อสมาชิกใหม่ในชีต ({sheetDiffResult.added.length} คน)
                          </span>
                          <span className="text-[11px] font-bold bg-black/20 px-2.5 py-0.5 rounded-full">
                            จะถูกเพิ่มและติดจุดสีเขียวอัตโนมัติ
                          </span>
                        </div>
                        <div className="p-3 space-y-2 max-h-72 overflow-y-auto flex-1">
                          {sheetDiffResult.added.length === 0 ? (
                            <div className="py-8 text-center text-slate-400 font-bold">
                              ไม่มีรายชื่อสมาชิกใหม่เพิ่มเข้ามา
                            </div>
                          ) : (
                            sheetDiffResult.added.map((r, i) => (
                              <div key={`${r.name}-${i}`} className="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-emerald-200 dark:border-emerald-800 shadow-sm">
                                <div className="min-w-0">
                                  <div className="font-black text-sm text-emerald-700 dark:text-emerald-300 truncate">
                                    #{r.sheetId} {r.name}
                                  </div>
                                  <div className="text-[11px] text-slate-500">
                                    {r.job} · Lv.{r.lv} · {r.gender} · {r.rank}
                                  </div>
                                </div>
                                <span className="px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 font-black tabular-nums">
                                  {(r.cp || 0).toLocaleString()}
                                </span>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    </div>

                    {/* ตารางพรีวิวข้อมูลจากชีตที่คัดกรองเฉพาะคอลัมน์ของเว็บแล้ว */}
                    <div className="border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
                      <div className="px-4 py-2.5 bg-slate-900 text-white flex items-center justify-between text-xs font-extrabold">
                        <span>📋 ตัวอย่างข้อมูลที่ดึงมาจากชีต (คัดเฉพาะ 7 คอลัมน์ของเว็บ: ID, ชื่อผู้เล่น, Lv., อาชีพ, เพศ, ตำแหน่ง, คะแนน Gear)</span>
                        <span className="text-emerald-300">รวม {sheetDiffResult.parsedRows.length} รายชื่อ</span>
                      </div>
                      <div className="max-h-60 overflow-y-auto">
                        <table className="w-full text-center border-collapse text-xs">
                          <thead className="bg-slate-100 dark:bg-slate-800 sticky top-0 font-extrabold text-slate-600 dark:text-slate-300">
                            <tr>
                              <th className="py-2 px-2">ID</th>
                              <th className="py-2 px-3">ชื่อผู้เล่น</th>
                              <th className="py-2 px-2">Lv.</th>
                              <th className="py-2 px-3">อาชีพ</th>
                              <th className="py-2 px-2">เพศ</th>
                              <th className="py-2 px-3">ตำแหน่ง</th>
                              <th className="py-2 px-3">คะแนน Gear</th>
                              <th className="py-2 px-3">สถานะการเช็คชื่อ</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-200/70 dark:divide-slate-800">
                            {sheetDiffResult.parsedRows.map((r, idx) => {
                              const isMatched = sheetDiffResult.matchedList.some((m) => m.newRow.name.toLowerCase() === r.name.toLowerCase());
                              const isRenamed = (sheetDiffResult.renamePairsList || []).some((p) => p.newRow.name.toLowerCase() === r.name.toLowerCase());
                              return (
                                <tr key={`${r.name}-${idx}`} className="hover:bg-slate-500/5">
                                  <td className="py-1.5 px-2 text-slate-400 font-bold tabular-nums">{r.sheetId}</td>
                                  <td className="py-1.5 px-3 font-extrabold text-sm">{r.name}</td>
                                  <td className="py-1.5 px-2 tabular-nums">{r.lv}</td>
                                  <td className="py-1.5 px-3 font-bold">{r.job}</td>
                                  <td className="py-1.5 px-2">{r.gender}</td>
                                  <td className="py-1.5 px-3">{r.rank}</td>
                                  <td className="py-1.5 px-3 font-extrabold tabular-nums">{(r.cp || 0).toLocaleString()}</td>
                                  <td className="py-1.5 px-3">
                                    {isRenamed ? (
                                      <span className="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-700 dark:text-amber-300 font-black text-[11px]">
                                        จับคู่เปลี่ยนชื่อแล้ว
                                      </span>
                                    ) : isMatched ? (
                                      <span className="px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-700 dark:text-sky-300 font-bold text-[11px]">
                                        ✓ ชื่อตรงกัน (อัปเดตข้อมูล)
                                      </span>
                                    ) : (
                                      <span className="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 font-black text-[11px]">
                                        + สมาชิกใหม่
                                      </span>
                                    )}
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <div className="flex justify-end gap-2 pt-2">
                      <button type="button" onClick={() => setIsSheetSyncOpen(false)} className="px-4 py-2 rounded-xl border font-bold">ยกเลิก</button>
                      <button type="button" onClick={handleApplySheetSync} className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-sm shadow">
                        ✓ ยืนยันอัปเดตข้อมูลและซิงค์ Cloud ทันที
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {confirmDeleteGroup && (
            <div onClick={() => setConfirmDeleteGroup(null)} className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className={`border rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 ${panelBgClass}`}>
                <h3 className="text-base font-black text-rose-600">ยืนยันการลบ {confirmDeleteGroup.name}?</h3>
                <p className="text-xs text-slate-500">ต้องการลบ <b>{confirmDeleteGroup.name}</b> ออกจากระบบใช่หรือไม่?</p>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setConfirmDeleteGroup(null)} className="px-4 py-2 rounded-xl border text-xs font-bold">ยกเลิก</button>
                  <button onClick={executeDeleteTeam} className="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold">ยืนยันลบทีม</button>
                </div>
              </div>
            </div>
          )}

          {confirmClearParty && (
            <div onClick={() => setConfirmClearParty(null)} className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className={`border rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 ${panelBgClass}`}>
                <h3 className="text-base font-black text-rose-600">
                  {confirmClearParty.mode === 'DELETE' ? `ยืนยันการลบ "${confirmClearParty.note}"?` : `ยืนยันการล้าง "${confirmClearParty.note}"?`}
                </h3>
                <p className="text-xs text-slate-500">
                  {confirmClearParty.mode === 'DELETE'
                    ? `ต้องการลบปาร์ตี้ "${confirmClearParty.note}" ออกจากทีมใช่หรือไม่?`
                    : `มีสมาชิกอยู่ในปาร์ตี้นี้ ${confirmClearParty.count} คน ต้องการนำออกทั้งหมดใช่หรือไม่?`}
                </p>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setConfirmClearParty(null)} className="px-4 py-2 rounded-xl border text-xs font-bold">ยกเลิก</button>
                  <button onClick={executeClearSingleParty} className="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold">ยืนยันดำเนินการ</button>
                </div>
              </div>
            </div>
          )}

          {alertModalInfo && (
            <div onClick={() => setAlertModalInfo(null)} className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className={`border rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 ${panelBgClass}`}>
                <h3 className="text-base font-black text-amber-500">{alertModalInfo.title}</h3>
                <p className="text-xs text-slate-500">{alertModalInfo.message}</p>
                <div className="flex justify-end">
                  <button onClick={() => setAlertModalInfo(null)} className="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold">รับทราบ</button>
                </div>
              </div>
            </div>
          )}

          {exportModalOpen && (
            <div onClick={() => setExportModalOpen(false)} className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className={`border rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4 ${panelBgClass}`}>
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="text-base font-black">{exportTitle}</h3>
                  <button onClick={() => setExportModalOpen(false)}>✕</button>
                </div>
                <textarea readOnly value={exportText} rows={10} className={`w-full border rounded-xl p-3 text-xs font-mono ${inputBgClass}`} />
                <div className="flex justify-end">
                  <button onClick={() => { navigator.clipboard.writeText(exportText); showToast('คัดลอกข้อความเรียบร้อยแล้ว!'); }} className="px-5 py-2 rounded-xl bg-indigo-600 text-white font-extrabold text-xs">คัดลอกข้อความ</button>
                </div>
              </div>
            </div>
          )}

          {isMemberModalOpen && (
            <div onClick={() => setIsMemberModalOpen(false)} className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
              <div onClick={(e) => e.stopPropagation()} className={`border rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 ${panelBgClass}`}>
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="text-base font-black">{editingMember ? `แก้ไข: ${editingMember.name}` : 'เพิ่มสมาชิกใหม่'}</h3>
                  <button onClick={() => setIsMemberModalOpen(false)}>✕</button>
                </div>
                <form onSubmit={handleSaveMember} className="space-y-3 text-xs">
                  <div className="grid grid-cols-4 gap-2">
                    <input type="number" value={formSheetId} onChange={(e) => setFormSheetId(e.target.value)} placeholder="ID" className={`border rounded-xl px-3 py-2 font-bold ${inputBgClass}`} />
                    <input type="text" required value={formName} onChange={(e) => setFormName(e.target.value)} placeholder="ชื่อตัวละคร" className={`col-span-2 border rounded-xl px-3 py-2 font-bold ${inputBgClass}`} />
                    <input type="number" value={formLv} onChange={(e) => setFormLv(e.target.value)} placeholder="Lv" className={`border rounded-xl px-3 py-2 font-bold ${inputBgClass}`} />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <select value={formJob} onChange={(e) => setFormJob(e.target.value)} className={`border rounded-xl px-3 py-2 font-bold ${inputBgClass}`}>
                      {jobClasses.map((j) => <option key={j.id} value={j.id}>{j.name}</option>)}
                    </select>
                    <input type="number" value={formCp} onChange={(e) => setFormCp(e.target.value)} placeholder="ค่าพลัง" className={`border rounded-xl px-3 py-2 font-bold ${inputBgClass}`} />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <select value={formGroup} onChange={(e) => setFormGroup(e.target.value)} className={`border rounded-xl px-3 py-2 font-bold ${inputBgClass}`}>
                      <option value="">กลุ่ม: —</option>
                      {GROUP_LETTERS.map((g) => <option key={g} value={g}>กลุ่ม {g}</option>)}
                    </select>
                    <select value={formDotColor} onChange={(e) => setFormDotColor(e.target.value)} className={`border rounded-xl px-3 py-2 font-bold ${inputBgClass}`}>
                      <option value="">จุดสี: ไม่มี</option>
                      <option value="red">สีแดง</option>
                      <option value="yellow">สีเหลือง</option>
                      <option value="green">สีเขียว</option>
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsMemberModalOpen(false)} className="px-4 py-2 rounded-xl border font-bold">ยกเลิก</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-indigo-600 text-white font-extrabold">บันทึก</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
